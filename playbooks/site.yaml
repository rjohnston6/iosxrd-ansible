---
- name: Configure IOS-XR devices
  hosts: provider_ix_pop
  gather_facts: false
  vars:
    iosxr_effective_model: >-
      {{
        (iosxr_model_defaults | default({}))
        | combine(iosxr_model_provider | default({}), recursive=True)
        | combine(iosxr_model_region | default({}), recursive=True)
        | combine(iosxr_model_device | default({}), recursive=True)
      }}
    iosxr_bgp_model: "{{ iosxr_effective_model.iosxr.devices.configuration.bgp | default({}) }}"
  roles:
    - iosxr_system
    - iosxr_l3_interfaces
    - iosxr_ntp
    - iosxr_isis
    - iosxr_bgp
