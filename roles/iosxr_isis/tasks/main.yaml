---
- name: Validate IS-IS SRv6 references before device access
  ansible.builtin.include_tasks: srv6.yaml
  loop: "{{ iosxr_effective_model.iosxr.devices.configuration.isis.processes | default([]) }}"
  loop_control:
    loop_var: iosxr_isis_process
    label: "{{ iosxr_isis_process.name }}"
  when: iosxr_effective_model.iosxr.devices.configuration.isis.enabled | default(false) | bool

- name: Check IOS-XR platform for IS-IS hello padding
  cisco.iosxr.iosxr_command:
    commands:
      - show version
  register: iosxr_isis_platform
  changed_when: false
  when:
    - iosxr_effective_model.iosxr.devices.configuration.isis.enabled | default(false) | bool
    - iosxr_effective_model.iosxr.devices.configuration.isis.processes | default([]) | length > 0

- name: Configure modeled IOS-XR IS-IS processes
  ansible.builtin.include_tasks: process.yaml
  loop: "{{ iosxr_effective_model.iosxr.devices.configuration.isis.processes | default([]) }}"
  loop_control:
    loop_var: iosxr_isis_process
    label: "{{ iosxr_isis_process.name }}"
  when: iosxr_effective_model.iosxr.devices.configuration.isis.enabled | default(false) | bool
