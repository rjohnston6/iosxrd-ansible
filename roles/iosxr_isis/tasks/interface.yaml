---
- name: Configure IOS-XR IS-IS interface attributes
  cisco.iosxr.iosxr_config:
    parents:
      - "router isis {{ iosxr_isis_process.name }}"
      - "interface {{ iosxr_isis_interface.name }}"
    lines: >-
      {{
        (['passive'] if iosxr_isis_interface.passive | default(false) else [])
        + (['circuit-type ' ~ iosxr_isis_interface.circuit_type]
           if iosxr_isis_interface.circuit_type is defined else [])
        + (['point-to-point'] if iosxr_isis_interface.point_to_point | default(false) else [])
      }}
  when:
    - iosxr_isis_interface.passive | default(false)
      or iosxr_isis_interface.circuit_type is defined
      or iosxr_isis_interface.point_to_point | default(false)

- name: Enable IOS-XR IS-IS interface address families
  cisco.iosxr.iosxr_config:
    parents:
      - "router isis {{ iosxr_isis_process.name }}"
      - "interface {{ iosxr_isis_interface.name }}"
    lines:
      - "address-family {{ iosxr_isis_address_family }} unicast"
  loop: "{{ iosxr_isis_interface.address_families | default([]) }}"
  loop_control:
    loop_var: iosxr_isis_address_family
    label: "{{ iosxr_isis_address_family }}"
