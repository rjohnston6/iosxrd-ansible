---
- name: Verify SRv6 locator and underlay models offline
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    iosxr_effective_model:
      iosxr:
        devices:
          configuration: "{{ srv6_test_configuration }}"
    srv6_test_expected_locators: |-
      segment-routing
       srv6
        locators
         locator MAIN_LOCATOR
          prefix 2001:db8:1f00:101::/64
    srv6_test_expected_isis: |-
      router isis CORE
       is-type level-2-only
       net 49.0001.0000.0000.0101.00
       address-family ipv6 unicast
        metric-style wide
        segment-routing srv6
         locator MAIN_LOCATOR
  tasks:
    - name: Load isolated SRv6 example
      ansible.builtin.include_vars:
        file: ../examples/srv6-model.yaml
        name: srv6_test_example

    - name: Resolve group enablement and device-specific locator
      ansible.builtin.set_fact:
        srv6_test_configuration: >-
          {{ srv6_test_example.iosxr.device_groups.srv6_core.configuration | combine(
               srv6_test_example.iosxr.devices['srv6-p-101'].configuration, recursive=True) }}

    - name: Validate local locator definitions without configuring devices
      ansible.builtin.include_role:
        name: iosxr_srv6
        tasks_from: validate.yaml

    - name: Validate IS-IS locator references without device access
      ansible.builtin.include_tasks: ../roles/iosxr_isis/tasks/srv6.yaml
      vars:
        iosxr_isis_process: "{{ srv6_test_configuration.isis.processes[0] }}"

    - name: Verify exact locator and IS-IS hierarchy
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.template', playbook_dir ~ '/../roles/iosxr_srv6/templates/locators.j2') | trim == srv6_test_expected_locators
          - lookup('ansible.builtin.template', playbook_dir ~ '/../roles/iosxr_isis/templates/process.j2') | trim == srv6_test_expected_isis
          - srv6_test_configuration.bgp.enabled | default(false) == false
      vars:
        iosxr_isis_process: "{{ srv6_test_configuration.isis.processes[0] }}"

    - name: Verify hyphens are rejected in locator names
      block:
        - name: Set invalid locator model
          ansible.builtin.set_fact:
            srv6_test_configuration:
              srv6:
                enabled: true
                locators:
                  MAIN-LOCATOR:
                    prefix: 2001:db8:1f00:101::/64
        - name: Validate invalid locator name
          ansible.builtin.include_role:
            name: iosxr_srv6
            tasks_from: validate.yaml
        - name: Fail if invalid locator name was accepted
          ansible.builtin.fail:
            msg: Locator name containing a hyphen was accepted.
      rescue:
        - name: Verify invalid locator name was rejected
          ansible.builtin.assert:
            that:
              - "'Locator MAIN-LOCATOR requires a name' in ansible_failed_result | to_json"

    - name: Restore valid underscore locator model
      ansible.builtin.set_fact:
        srv6_test_configuration: >-
          {{ srv6_test_example.iosxr.device_groups.srv6_core.configuration | combine(
               srv6_test_example.iosxr.devices['srv6-p-101'].configuration, recursive=True) }}

    - name: Reject invalid IS-IS SRv6 advertisement
      block:
        - name: Validate invalid advertisement references
          ansible.builtin.include_tasks: ../roles/iosxr_isis/tasks/srv6.yaml
          vars:
            iosxr_isis_process:
              name: CORE
              address_families:
                - name: ipv6
                  srv6:
                    locators: [UNDEFINED]
        - name: Fail if invalid advertisement was accepted
          ansible.builtin.fail:
            msg: Invalid advertisement was accepted.
      rescue:
        - name: Verify advertisement validation failed as intended
          ansible.builtin.assert:
            that:
              - "'IS-IS SRv6 advertisement requires' in ansible_failed_result.results[0].msg"

    - name: Reject SRv6 advertisement outside IPv6 unicast
      block:
        - name: Validate IPv4 advertisement
          ansible.builtin.include_tasks: ../roles/iosxr_isis/tasks/srv6.yaml
          vars:
            iosxr_isis_process:
              name: CORE
              address_families:
                - name: ipv4
                  srv6:
                    locators: [MAIN_LOCATOR]
        - name: Fail if IPv4 advertisement was accepted
          ansible.builtin.fail:
            msg: IPv4 advertisement was accepted.
      rescue:
        - name: Verify IPv4 advertisement was rejected
          ansible.builtin.assert:
            that:
              - "'IS-IS SRv6 advertisement requires' in ansible_failed_result.results[0].msg"

    - name: Reject advertisement with disabled local SRv6
      block:
        - name: Validate disabled local SRv6 advertisement
          ansible.builtin.include_tasks: ../roles/iosxr_isis/tasks/srv6.yaml
          vars:
            srv6_test_configuration:
              srv6:
                enabled: false
                locators:
                  MAIN_LOCATOR:
                    prefix: 2001:db8:1f00:101::/64
            iosxr_isis_process:
              name: CORE
              address_families:
                - name: ipv6
                  srv6:
                    locators: [MAIN_LOCATOR]
        - name: Fail if disabled local SRv6 was accepted
          ansible.builtin.fail:
            msg: Disabled local SRv6 was accepted.
      rescue:
        - name: Verify disabled local SRv6 was rejected
          ansible.builtin.assert:
            that:
              - "'IS-IS SRv6 advertisement requires' in ansible_failed_result.results[0].msg"

    - name: Remove SRv6 from the test configuration
      ansible.builtin.set_fact:
        srv6_test_configuration: {}

    - name: Verify absent SRv6 never configures a device
      ansible.builtin.include_role:
        name: iosxr_srv6

    - name: Disable SRv6 with inherited locators in the test configuration
      ansible.builtin.set_fact:
        srv6_test_configuration:
          srv6:
            enabled: false
            locators:
              MAIN_LOCATOR:
                prefix: 2001:db8:1f00:101::/64

    - name: Verify disabled SRv6 never configures inherited locators
      ansible.builtin.include_role:
        name: iosxr_srv6
