[defaults]
# Removed hardcoded inventory to support local/testbed inventories
roles_path = ./roles
collections_path = ./.ansible/collections
host_key_checking = True
retry_files_enabled = False
# Enable pipelining for significantly faster execution on network devices
pipelining = True

[persistent_connection]
ssh_type = libssh
connect_timeout = 30
command_timeout = 30

