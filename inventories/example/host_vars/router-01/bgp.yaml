---
iosxr:
  devices:
    router-01:
      configuration:
        enabled: true
        as_number: 64512
        router_id_interface: Loopback0
        address_families:
          - afi: ipv4
            safi: unicast
          - afi: ipv6
            safi: unicast
        neighbor_groups:
          - name: EBGP-AS64513
            remote_as: 64513
            address_families:
              - afi: ipv4
                safi: unicast
                route_policy:
                  inbound: EBGP-ACCEPT-ALL
                  outbound: EBGP-ACCEPT-ALL
              - afi: ipv6
                safi: unicast
                route_policy:
                  inbound: EBGP-ACCEPT-ALL
                  outbound: EBGP-ACCEPT-ALL
        neighbors:
          - neighbor_address: 192.0.2.2
            description: eBGP peer via IPv4
            use:
              neighbor_group: EBGP-AS64513
          - neighbor_address: 2001:db8:acad::2
            description: eBGP peer via IPv6
            use:
              neighbor_group: EBGP-AS64513
