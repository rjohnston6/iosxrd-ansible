---
iosxr_model_device:
  iosxr:
    devices:
      configuration:
        hostname: ix-pop
        interfaces:
          - name: GigabitEthernet0/0/0/1
            description: << To mtc-core-02 gi0/0/0/2 >>
            enabled: true
            mtu: 1500
          - name: Loopback0
            description: << Router ID >>
            enabled: true
        l3_interfaces:
          - name: GigabitEthernet0/0/0/1
            ipv4:
              - address: 198.19.1.0/31
            ipv6:
              - address: 2001:db8:5555:2000::1/64
          - name: Loopback0
            ipv4:
              - address: 198.19.0.1/31
            ipv6:
              - address: 2001:db8:5555::1/128
        banners:
          - banner: login
            text: |-
              @Authorized users only. Unauthorized access is prohibited.@
          - banner: motd
            text: |-
              @Authorized access only. Activity may be monitored.@
        bgp:
          as_number: 64520
          router_id_interface: Loopback0
          route_policies:
            - name: EBGP-ACCEPT-ALL
              statements:
                - pass
          address_families:
            - afi: ipv4
              safi: unicast
            - afi: ipv6
              safi: unicast
          peer_groups:
            - name: EBGP-AS64521
              remote_as: 64521
              address_family:
                - afi: ipv4
                  safi: unicast
                  route_policy:
                    inbound: EBGP-ACCEPT-ALL
                    outbound: EBGP-ACCEPT-ALL
                - afi: ipv6
                  safi: unicast
                  route_policy:
                    inbound: EBGP-ACCEPT-ALL
                    outbound: EBGP-ACCEPT-ALL
          global:
            neighbors:
              - neighbor_address: 198.19.1.1
                description: eBGP peer via IPv4
                use:
                  neighbor_group: EBGP-AS64521
              - neighbor_address: 2001:db8:5555:2000::2
                description: eBGP peer via IPv6
                use:
                  neighbor_group: EBGP-AS64521
